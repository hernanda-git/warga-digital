<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas RT Summary - Warga Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.10.3/dist/Recharts.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            },
            app: {
              surface: '#ffffff',
              'surface-alt': '#f9fafb',
            }
          }
        }
      }
    }
  </script>
  <style>
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-app-surface-alt">
  <div id="root"></div>

  <script>
    // Mock Data - Year to Date 2026 (Jan - Apr)
    const mockData = {
      selectedMonth: {
        year: 2026,
        month: 4,
        label: 'April 2026',
        income: 12500000,
        expense: 8750000,
        net: 3750000,
        transactionCount: 47,
        byCategory: [
          { category: 'IPL', amount: 8500000, count: 28, percentage: 50.3 },
          { category: 'Iuran Sampah', amount: 2100000, count: 12, percentage: 12.4 },
          { category: 'Kegiatan RT', amount: 1850000, count: 5, percentage: 10.9 },
          { category: 'Perbaikan Fasilitas', amount: 1200000, count: 3, percentage: 7.1 },
          { category: 'Keamanan', amount: 950000, count: 8, percentage: 5.6 },
          { category: 'Lainnya', amount: 6250000, count: 11, percentage: 36.8 }
        ],
        dailyBreakdown: []
      },
      previousMonth: {
        income: 11200000,
        expense: 9100000,
        net: 2100000,
        label: 'Maret 2026'
      },
      yearlyTrend: [
        { month: '2026-01', label: 'Jan', income: 9800000, expense: 7200000 },
        { month: '2026-02', label: 'Feb', income: 10500000, expense: 8100000 },
        { month: '2026-03', label: 'Mar', income: 11200000, expense: 9100000 },
        { month: '2026-04', label: 'Apr', income: 12500000, expense: 8750000 }
      ],
      iplCollection: {
        totalHouses: 85,
        paidHouses: 68,
        percentage: 80,
        unpaidHouses: []
      },
      stats: {
        avgPerDay: 708333,
        bestDay: { date: '2026-04-15', amount: 2500000 },
        worstDay: { date: '2026-04-08', amount: -1200000 },
        highestCategory: { name: 'IPL', amount: 8500000 }
      }
    };

    // Format Rupiah
    function formatRupiah(amount) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(amount);
    }

    function formatRupiahCompact(amount) {
      if (amount >= 1000000) {
        return 'Rp ' + (amount / 1000000).toFixed(1) + 'M';
      }
      if (amount >= 1000) {
        return 'Rp ' + (amount / 1000).toFixed(0) + 'K';
      }
      return 'Rp ' + amount.toFixed(0);
    }

    function formatDateIndonesian(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('id-ID', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });
    }

    function calculateChange(current, previous) {
      if (previous === 0) return current > 0 ? 100 : 0;
      return ((current - previous) / previous) * 100;
    }

    function renderChangeBadge(percent) {
      const isPositive = percent >= 0;
      const absPercent = Math.abs(percent).toFixed(1);
      const icon = isPositive ? '↑' : '↓';
      const bgColor = isPositive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
      return `
        <span class="inline-flex items-center gap-0.5 rounded-full px-1.5 py-0.5 text-[10px] font-bold ${bgColor}">
          ${icon} ${absPercent}%
        </span>
      `;
    }

    // Header Component
    function renderHeader() {
      return `
        <header class="sticky top-0 z-20 bg-white px-4 py-3 shadow-sm">
          <div class="flex items-center gap-3">
            <button
              type="button"
              class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100 transition hover:bg-gray-200 active:scale-95"
              aria-label="Kembali"
            >
              <svg class="h-5 w-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
              </svg>
            </button>

            <div class="min-w-0 flex-1">
              <p class="text-[10px] font-bold uppercase tracking-widest text-gray-500">Keuangan RT</p>
              <h1 class="truncate text-base font-extrabold text-gray-900">Ringkasan</h1>
            </div>

            <div class="relative">
              <button
                type="button"
                class="flex h-9 w-9 items-center justify-center rounded-xl bg-white/20 backdrop-blur-sm transition hover:bg-white/30 active:scale-90"
                aria-label="Ekspor laporan"
              >
                <svg class="h-4 w-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
              </button>
            </div>
          </div>

          <div class="mt-3">
            ${renderMonthNavigator()}
          </div>
        </header>
      `;
    }

    // Month Navigator
    function renderMonthNavigator() {
      return `
        <div class="flex items-center justify-between rounded-xl bg-white px-4 py-3 shadow-sm">
          <button
            type="button"
            class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100 transition hover:bg-gray-200 active:scale-95"
            aria-label="Bulan sebelumnya"
          >
            <svg class="h-5 w-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
          </button>

          <div class="text-center">
            <p class="text-sm font-bold text-gray-900">${mockData.selectedMonth.label}</p>
          </div>

          <button
            type="button"
            class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100 transition hover:bg-gray-200 active:scale-95"
            aria-label="Bulan berikutnya"
          >
            <svg class="h-5 w-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
      `;
    }

    // Summary Hero
    function renderSummaryHero() {
      const { selectedMonth, previousMonth } = mockData;
      const incomeChange = calculateChange(selectedMonth.income, previousMonth.income);
      const expenseChange = calculateChange(selectedMonth.expense, previousMonth.expense);
      const netChange = calculateChange(selectedMonth.net, previousMonth.net);

      return `
        <section
          class="shrink-0 overflow-hidden rounded-b-3xl bg-gradient-to-br from-primary-600 to-primary-700 px-4 pb-6 pt-5 text-white"
          aria-label="Ringkasan Keuangan"
        >
          <div class="pointer-events-none absolute -right-8 -top-8 h-32 w-32 rounded-full bg-white/10"></div>
          <div class="pointer-events-none absolute -bottom-6 -left-6 h-24 w-24 rounded-full bg-white/10"></div>

          <div class="relative z-10">
            <div class="flex items-start justify-between">
              <div>
                <p class="text-[10px] font-bold uppercase tracking-widest text-white/70">
                  ${selectedMonth.label}
                </p>
                <h2 class="mt-1 text-lg font-extrabold leading-tight text-white">Ringkasan</h2>
              </div>
              <div class="text-right">
                <p class="text-[10px] font-semibold uppercase tracking-wider text-white/60">Transaksi</p>
                <p class="text-sm font-bold text-white">${selectedMonth.transactionCount}</p>
              </div>
            </div>

            <div class="mt-5">
              <p class="text-[9px] font-semibold uppercase tracking-widest text-white/60">Saldo Bersih</p>
              <p class="mt-1 text-[28px] font-extrabold leading-tight text-white">
                ${formatRupiah(selectedMonth.net)}
              </p>
            </div>

            <div class="mt-5 grid grid-cols-3 gap-2">
              <div class="rounded-xl bg-white/15 p-2.5 text-center backdrop-blur-sm transition hover:bg-white/20">
                <p class="text-[9px] font-semibold uppercase tracking-wider leading-tight text-white/60">Pemasukan</p>
                <div class="mt-1 flex items-center justify-center gap-1">
                  <p class="text-sm font-extrabold leading-tight text-white">
                    ${formatRupiahCompact(selectedMonth.income)}
                  </p>
                  ${renderChangeBadge(incomeChange)}
                </div>
                <p class="mt-0.5 text-[8px] leading-tight text-white/50">vs bulan sebelumnya</p>
              </div>

              <div class="rounded-xl bg-white/15 p-2.5 text-center backdrop-blur-sm transition hover:bg-white/20">
                <p class="text-[9px] font-semibold uppercase tracking-wider leading-tight text-white/60">Pengeluaran</p>
                <div class="mt-1 flex items-center justify-center gap-1">
                  <p class="text-sm font-extrabold leading-tight text-white">
                    ${formatRupiahCompact(selectedMonth.expense)}
                  </p>
                  ${renderChangeBadge(expenseChange)}
                </div>
                <p class="mt-0.5 text-[8px] leading-tight text-white/50">vs bulan sebelumnya</p>
              </div>

              <div class="rounded-xl bg-white/15 p-2.5 text-center backdrop-blur-sm transition hover:bg-white/20">
                <p class="text-[9px] font-semibold uppercase tracking-wider leading-tight text-white/60">Laba/Rugi</p>
                <div class="mt-1 flex items-center justify-center gap-1">
                  <p class="text-sm font-extrabold leading-tight text-white">
                    ${formatRupiahCompact(selectedMonth.net)}
                  </p>
                  ${renderChangeBadge(netChange)}
                </div>
                <p class="mt-0.5 text-[8px] leading-tight text-white/50">vs ${previousMonth.label}</p>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    // IPL Progress
    function renderIplProgress() {
      const { totalHouses, paidHouses, percentage } = mockData.iplCollection;
      return `
        <div class="rounded-xl bg-white p-4 shadow-sm" aria-label="Koleksi IPL">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm font-bold text-gray-900">Koleksi IPL</p>
              <p class="text-xs text-gray-500">${paidHouses} dari ${totalHouses} rumah</p>
            </div>
            <div class="text-right">
              <p class="text-2xl font-extrabold text-primary-600">${percentage}%</p>
            </div>
          </div>

          <div class="mt-3 h-3 w-full overflow-hidden rounded-full bg-gray-200">
            <div
              class="h-full rounded-full bg-gradient-to-r from-primary-500 to-primary-600 transition-all duration-500 ease-out"
              style="width: ${percentage}%"
            ></div>
          </div>

          <div class="mt-2 flex items-center justify-between text-xs">
            <div class="flex items-center gap-1 text-gray-600">
              <svg class="h-4 w-4 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
              </svg>
              <span>${paidHouses} rumah sudah bayar</span>
            </div>
            <div class="text-gray-500">${totalHouses - paidHouses} rumah belum</div>
          </div>
        </div>
      `;
    }

    // Monthly Chart using Recharts
    function renderMonthlyChart() {
      const { yearlyTrend } = mockData;
      const chartData = yearlyTrend.map(item => ({
        ...item,
        formattedIncome: formatRupiahCompact(item.income),
        formattedExpense: formatRupiahCompact(item.expense)
      }));

      return `
        <div class="rounded-xl bg-white p-4 shadow-sm" aria-label="Tren 12 Bulan">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-bold text-gray-900">Tren Tahun Ini</h3>
            <span class="text-xs text-gray-500">dalam Rupiah</span>
          </div>

          <div class="mt-4 overflow-x-auto overflow-y-hidden">
            <div class="min-w-[600px]">
              <div id="monthly-chart" style="width: 100%; height: 220px;"></div>
            </div>
          </div>

          <div class="mt-3 flex justify-center gap-6 text-xs">
            <div class="flex items-center gap-1.5">
              <div class="h-2.5 w-2.5 rounded-full bg-green-500"></div>
              <span class="text-gray-600">Pemasukan</span>
            </div>
            <div class="flex items-center gap-1.5">
              <div class="h-2.5 w-2.5 rounded-full bg-red-500"></div>
              <span class="text-gray-600">Pengeluaran</span>
            </div>
          </div>
        </div>
      `;
    }

    // Category Breakdown
    function renderCategoryBreakdown() {
      const { byCategory } = mockData.selectedMonth;
      const topCategories = byCategory.slice(0, 10);
      const maxAmount = Math.max(...topCategories.map(c => c.amount));

      return `
        <div class="rounded-xl bg-white p-4 shadow-sm" aria-label="Breakdown Kategori">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-bold text-gray-900">Kategori</h3>
            <span class="text-xs text-gray-500">${topCategories.length} kategori</span>
          </div>

          <div class="mt-4 space-y-3">
            ${topCategories.map((cat, index) => {
              const barWidth = maxAmount > 0 ? (cat.amount / maxAmount) * 100 : 0;
              const isIncome = cat.category.toLowerCase().includes('pemasukan') ||
                              cat.category === 'IPL' ||
                              cat.category === 'Iuran Bulanan';
              let barColor = 'from-red-500 to-red-600';
              if (cat.category === 'IPL') barColor = 'from-primary-500 to-primary-600';
              else if (isIncome) barColor = 'from-green-500 to-green-600';

              return `
                <div class="space-y-1">
                  <div class="flex items-center justify-between gap-2">
                    <div class="min-w-0 flex-1">
                      <p class="text-xs font-medium text-gray-900 truncate">${cat.category}</p>
                      <p class="text-[10px] text-gray-500">${cat.count} transaksi</p>
                    </div>
                    <div class="text-right shrink-0">
                      <p class="text-xs font-bold text-gray-900">${formatRupiahCompact(cat.amount)}</p>
                      <p class="text-[10px] text-gray-500">${cat.percentage.toFixed(1)}%</p>
                    </div>
                  </div>

                  <div class="h-2 w-full overflow-hidden rounded-full bg-gray-100">
                    <div
                      class="h-full rounded-full bg-gradient-to-r ${barColor} transition-all duration-300 ease-out"
                      style="width: ${barWidth}%"
                    ></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // Quick Stats
    function renderQuickStats() {
      const { avgPerDay, bestDay, worstDay, highestCategory } = mockData.stats;

      return `
        <div class="rounded-xl bg-white p-4 shadow-sm" aria-label="Statistik Cepat">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-bold text-gray-900">Statistik Cepat</h3>
          </div>

          <div class="mt-4 grid grid-cols-2 gap-3">
            <div class="rounded-lg bg-gray-50 p-3">
              <p class="text-[10px] font-semibold uppercase tracking-wider text-gray-500">Rata-rata/Hari</p>
              <p class="mt-1.5 text-sm font-extrabold text-gray-900">${formatRupiahCompact(avgPerDay)}</p>
            </div>

            <div class="rounded-lg bg-gray-50 p-3">
              <p class="text-[10px] font-semibold uppercase tracking-wider text-gray-500">Kategori Tertinggi</p>
              <p class="mt-1.5 text-sm font-bold text-primary-600 truncate">${highestCategory.name}</p>
              <p class="text-xs text-gray-500">${formatRupiahCompact(highestCategory.amount)}</p>
            </div>

            <div class="rounded-lg bg-green-50 p-3">
              <p class="text-[10px] font-semibold uppercase tracking-wider text-green-600">Hari Terbaik</p>
              <p class="mt-1.5 text-sm font-bold text-green-700">${formatRupiahCompact(bestDay.amount)}</p>
              <p class="text-xs text-green-600">${formatDateIndonesian(bestDay.date)}</p>
            </div>

            <div class="rounded-lg bg-red-50 p-3">
              <p class="text-[10px] font-semibold uppercase tracking-wider text-red-600">Hari Terburuk</p>
              <p class="mt-1.5 text-sm font-bold text-red-700">${formatRupiahCompact(worstDay.amount)}</p>
              <p class="text-xs text-red-600">${formatDateIndonesian(worstDay.date)}</p>
            </div>
          </div>
        </div>
      `;
    }

    // Render the full page
    function renderPage() {
      const html = `
        <main class="flex min-h-screen flex-col bg-app-surface-alt">
          ${renderHeader()}

          <div class="flex-1 overflow-y-auto overscroll-contain p-4">
            ${renderSummaryHero()}
            <div class="mt-4"></div>
            ${renderIplProgress()}
            <div class="mt-4"></div>
            ${renderMonthlyChart()}
            <div class="mt-4"></div>
            ${renderCategoryBreakdown()}
            <div class="mt-4"></div>
            ${renderQuickStats()}
            <div class="h-8"></div>
          </div>
        </main>
      `;

      document.getElementById('root').innerHTML = html;

      // Render Recharts after DOM is ready
      setTimeout(renderRecharts, 100);
    }

    // Render Recharts bar chart
    function renderRecharts() {
      const { createElement: e } = Recharts;
      const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

      const chartData = mockData.yearlyTrend.map(item => ({
        ...item,
        formattedIncome: formatRupiahCompact(item.income),
        formattedExpense: formatRupiahCompact(item.expense)
      }));

      const CustomTooltip = ({ active, payload, label }) => {
        if (active && payload && payload.length) {
          return e('div', {
            className: 'rounded-lg bg-white p-3 shadow-lg border border-gray-100'
          }, [
            e('p', { className: 'text-sm font-bold text-gray-900' }, label),
            ...payload.map((entry, index) => 
              e('p', {
                key: index,
                className: `text-xs ${entry.dataKey === 'income' ? 'text-green-600' : 'text-red-600'}`
              }, `${entry.name === 'income' ? 'Pemasukan' : 'Pengeluaran'}: ${formatRupiahCompact(entry.value)}`)
            )
          ]);
        }
        return null;
      };

      const chart = e(ResponsiveContainer, { width: '100%', height: 220 }, [
        e(BarChart, {
          data: chartData,
          margin: { top: 10, right: 10, left: -20, bottom: 0 },
          barCategoryGap: '20%',
          barGap: 4
        }, [
          e(CartesianGrid, { strokeDasharray: '3 3', stroke: '#f0f0f0' }),
          e(XAxis, {
            dataKey: 'label',
            tick: { fontSize: 11, fill: '#6b7280' },
            axisLine: { stroke: '#e5e7eb' },
            tickLine: { stroke: '#e5e7eb' }
          }),
          e(YAxis, {
            tickFormatter: (value) => {
              if (value >= 1000000) return `${(value / 1000000).toFixed(1)}M`;
              if (value >= 1000) return `${(value / 1000).toFixed(0)}K`;
              return value.toString();
            },
            tick: { fontSize: 10, fill: '#6b7280' },
            axisLine: { stroke: '#e5e7eb' },
            tickLine: { stroke: '#e5e7eb' },
            width: 45
          }),
          e(Tooltip, { content: e(CustomTooltip) }),
          e(Legend, {
            wrapperStyle: { fontSize: '12px', paddingTop: '8px' },
            formatter: (value) => value === 'income' ? 'Pemasukan' : 'Pengeluaran'
          }),
          e(Bar, {
            dataKey: 'income',
            name: 'income',
            fill: '#10b981',
            radius: [4, 4, 0, 0],
            maxBarSize: 24
          }),
          e(Bar, {
            dataKey: 'expense',
            name: 'expense',
            fill: '#ef4444',
            radius: [4, 4, 0, 0],
            maxBarSize: 24
          })
        ])
      ]);

      Recharts.render(chart, document.getElementById('monthly-chart'));
    }

    // Initialize
    renderPage();
  </script>
</body>
</html>
